<svg width="1600" height="350" viewBox="0 0 1600 350" xmlns="http://www.w3.org/2000/svg">

  <!-- ===== GRADIENTS ===== -->
  <defs>

    <!-- Metallic Grey -->
    <linearGradient id="greyMetal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f2f2f2"/>
      <stop offset="35%" stop-color="#b5b5b5"/>
      <stop offset="75%" stop-color="#5e5e5e"/>
      <stop offset="100%" stop-color="#3a3a3a"/>
    </linearGradient>

    <!-- Metallic Red -->
    <linearGradient id="redMetal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff5a5a"/>
      <stop offset="35%" stop-color="#d41e1e"/>
      <stop offset="75%" stop-color="#9b0000"/>
      <stop offset="100%" stop-color="#5a0000"/>
    </linearGradient>

    <!-- Subtle Gloss Highlight -->
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.6)"/>
      <stop offset="40%" stop-color="rgba(255,255,255,0.2)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>

    <!-- Clip for glossy highlights -->
    <clipPath id="textClip">
      <text id="mainText"
            x="80" y="220"
            font-family="Poppins, Arial, sans-serif"
            font-size="170"
            font-weight="800"
            letter-spacing="6">
        DEVAPRAKASH
      </text>
    </clipPath>

  </defs>

  <!-- ===== BASE TEXT COLORS ===== -->

  <!-- DEVA (Grey) -->
  <text x="80" y="220"
        font-family="Poppins, Arial, sans-serif"
        font-size="170"
        font-weight="800"
        letter-spacing="6"
        fill="url(#greyMetal)">
        DEVA
  </text>

  <!-- PRAKASH (Red) -->
  <text x="520" y="220"
        font-family="Poppins, Arial, sans-serif"
        font-size="170"
        font-weight="800"
        letter-spacing="6"
        fill="url(#redMetal)">
        PRAKASH
  </text>

  <!-- ===== GLOSS LAYER ===== -->
  <rect x="0" y="0" width="1600" height="350"
        fill="url(#gloss)"
        clip-path="url(#textClip)"
        opacity="0.35"/>
</svg>
